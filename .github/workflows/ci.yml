name: SNX / CI

on:
  push:
    branches: [main, dev, "chore/**"]
  pull_request:
    branches: [main, dev]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest

    steps:
      - name: SNX / Checkout
        uses: actions/checkout@v4

      - name: SNX / Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: SNX / Install
        run: npm ci

      - name: SNX / Syntax and integration tests
        run: npm test

      - name: SNX / Validate identifiers
        run: npm run snx:validate

      - name: SNX / Compile EJS templates
        run: npm run test:ejs

      - name: SNX / Bounded load test
        run: npm run test:load

      - name: SNX / Dependency audit
        run: npm audit --audit-level=moderate

      - name: SNX / Secret pattern scan
        run: npm run scan:secrets
